name: Deploy — Cloud Run

on:
  workflow_dispatch:

env:
  AR_LOCATION: southamerica-east1
  AR_REPOSITORY: flyspot
  IMAGE: southamerica-east1-docker.pkg.dev/lista-ai-f2916/flyspot/flyspot-api

jobs:
  deploy:
    name: Build & Deploy flyspot-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Garantir que o repositório Artifact Registry existe
        run: |
          gcloud artifacts repositories describe ${{ env.AR_REPOSITORY }} \
            --location=${{ env.AR_LOCATION }} \
            --project=lista-ai-f2916 \
            || gcloud artifacts repositories create ${{ env.AR_REPOSITORY }} \
                 --repository-format=docker \
                 --location=${{ env.AR_LOCATION }} \
                 --project=lista-ai-f2916 \
                 --description="Imagens Docker do FlySpot"

      - name: Configurar Docker para o Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build da imagem Docker
        run: |
          docker build \
            -f services/api/Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push para o Artifact Registry
        run: docker push --all-tags ${{ env.IMAGE }}

      - name: Deploy para Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: flyspot-api
          image: ${{ env.IMAGE }}:latest
          region: southamerica-east1
          project_id: lista-ai-f2916
          flags: --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            FIREBASE_PROJECT_ID=lista-ai-f2916

      - name: URL do serviço
        run: echo "✅ Deploy concluído"
