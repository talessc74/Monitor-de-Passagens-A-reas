name: Deploy — Cloud Run

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy flyspot-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build da imagem Docker
        run: |
          docker build \
            -f services/api/Dockerfile \
            -t gcr.io/lista-ai-f2916/flyspot-api:${{ github.sha }} \
            -t gcr.io/lista-ai-f2916/flyspot-api:latest \
            .

      - name: Push para Container Registry
        run: docker push --all-tags gcr.io/lista-ai-f2916/flyspot-api

      - name: Deploy para Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: flyspot-api
          image: gcr.io/lista-ai-f2916/flyspot-api:latest
          region: southamerica-east1
          project_id: lista-ai-f2916
          flags: --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            FIREBASE_PROJECT_ID=lista-ai-f2916

      - name: URL do serviço
        run: echo "✅ Deploy concluído"
