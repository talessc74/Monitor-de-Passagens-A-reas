name: Deploy — Cloud Run

on:
  workflow_dispatch:

env:
  AR_LOCATION: southamerica-east1
  AR_REPOSITORY: flyspot
  IMAGE_API: southamerica-east1-docker.pkg.dev/lista-ai-f2916/flyspot/flyspot-api
  IMAGE_GENERATOR: southamerica-east1-docker.pkg.dev/lista-ai-f2916/flyspot/flyspot-generator
  IMAGE_PUBLISHER: southamerica-east1-docker.pkg.dev/lista-ai-f2916/flyspot/flyspot-publisher
  IMAGE_SCRAPER: southamerica-east1-docker.pkg.dev/lista-ai-f2916/flyspot/flyspot-scraper
  IMAGE_WEB: southamerica-east1-docker.pkg.dev/lista-ai-f2916/flyspot/flyspot-web

jobs:
  deploy:
    name: Build & Deploy flyspot-scraper + flyspot-api + flyspot-generator + flyspot-publisher + flyspot-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Garantir que o repositório Artifact Registry existe
        run: |
          gcloud artifacts repositories describe ${{ env.AR_REPOSITORY }} \
            --location=${{ env.AR_LOCATION }} \
            --project=lista-ai-f2916 \
            || gcloud artifacts repositories create ${{ env.AR_REPOSITORY }} \
                 --repository-format=docker \
                 --location=${{ env.AR_LOCATION }} \
                 --project=lista-ai-f2916 \
                 --description="Imagens Docker do FlySpot"

      - name: Configurar Docker para o Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_LOCATION }}-docker.pkg.dev --quiet

      # ── flyspot-scraper (busca de preço real sob demanda, Playwright —
      # ver _local-bdr-policy-015) — deploya ANTES do api porque o api
      # precisa da URL dela em SCRAPER_INTERNAL_URL. Serviço isolado de
      # propósito: uma falha nessa imagem experimental (Chromium, mais
      # pesada) nunca deve travar o deploy do api/generator/publisher/web,
      # que já funcionam. ──────────────────────────────────────────────────
      - name: Build da imagem Docker — scraper
        run: |
          docker build \
            -f services/scraper/Dockerfile \
            -t ${{ env.IMAGE_SCRAPER }}:${{ github.sha }} \
            -t ${{ env.IMAGE_SCRAPER }}:latest \
            .

      - name: Push para o Artifact Registry — scraper
        run: docker push --all-tags ${{ env.IMAGE_SCRAPER }}

      - name: Deploy para Cloud Run — scraper
        id: deploy-scraper
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: flyspot-scraper
          image: ${{ env.IMAGE_SCRAPER }}:latest
          region: southamerica-east1
          project_id: lista-ai-f2916
          # Sem min-instances: uso é sob demanda (clique do usuário), não
          # precisa ficar de pé 24/7 como generator/publisher — escala a
          # zero entre buscas pra não gastar à toa. Memória/CPU maiores
          # que o padrão porque o Chromium do Playwright precisa de mais
          # que os serviços Node puros. Timeout maior que o default (300s
          # já cobre, mas deixamos explícito) pra sobrar folga do
          # SCRAPE_TIMEOUT_MS interno (45s) mais o cold start do Chromium.
          flags: --allow-unauthenticated --memory=1Gi --cpu=1 --timeout=120s
          env_vars: |
            NODE_ENV=production
            INTERNAL_SCAN_TOKEN=${{ secrets.INTERNAL_SCAN_TOKEN }}

      # ── flyspot-api ──────────────────────────────────────────────────────
      - name: Build da imagem Docker — api
        run: |
          docker build \
            -f services/api/Dockerfile \
            -t ${{ env.IMAGE_API }}:${{ github.sha }} \
            -t ${{ env.IMAGE_API }}:latest \
            .

      - name: Push para o Artifact Registry — api
        run: docker push --all-tags ${{ env.IMAGE_API }}

      - name: Deploy para Cloud Run — api
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: flyspot-api
          image: ${{ env.IMAGE_API }}:latest
          region: southamerica-east1
          project_id: lista-ai-f2916
          flags: --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            FIREBASE_PROJECT_ID=lista-ai-f2916
            INTERNAL_SCAN_TOKEN=${{ secrets.INTERNAL_SCAN_TOKEN }}
            EMAIL_ACTION_SECRET=${{ secrets.EMAIL_ACTION_SECRET }}
            APP_URL=${{ secrets.APP_URL }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            STRIPE_PRICE_ID_PRO=${{ secrets.STRIPE_PRICE_ID_PRO }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            TRAVELPAYOUTS_API_TOKEN=${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
            RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}
            SCRAPER_INTERNAL_URL=${{ steps.deploy-scraper.outputs.url }}

      # ── flyspot-generator (Fase 4 — scheduler) ──────────────────────────
      - name: Build da imagem Docker — generator
        run: |
          docker build \
            -f services/generator/Dockerfile \
            -t ${{ env.IMAGE_GENERATOR }}:${{ github.sha }} \
            -t ${{ env.IMAGE_GENERATOR }}:latest \
            .

      - name: Push para o Artifact Registry — generator
        run: docker push --all-tags ${{ env.IMAGE_GENERATOR }}

      - name: Deploy para Cloud Run — generator
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: flyspot-generator
          image: ${{ env.IMAGE_GENERATOR }}:latest
          region: southamerica-east1
          project_id: lista-ai-f2916
          # min-instances=1 é obrigatório: o loop de polling do scheduler
          # só existe enquanto o processo está de pé, e Cloud Run escala
          # a zero por padrão quando não há requisição HTTP chegando.
          flags: --allow-unauthenticated --min-instances=1
          env_vars: |
            NODE_ENV=production
            FIREBASE_PROJECT_ID=lista-ai-f2916
            API_INTERNAL_URL=${{ steps.deploy-api.outputs.url }}
            INTERNAL_SCAN_TOKEN=${{ secrets.INTERNAL_SCAN_TOKEN }}

      # ── flyspot-publisher (Fase 5 — e-mail via Resend) ──────────────────
      - name: Build da imagem Docker — publisher
        run: |
          docker build \
            -f services/publisher/Dockerfile \
            -t ${{ env.IMAGE_PUBLISHER }}:${{ github.sha }} \
            -t ${{ env.IMAGE_PUBLISHER }}:latest \
            .

      - name: Push para o Artifact Registry — publisher
        run: docker push --all-tags ${{ env.IMAGE_PUBLISHER }}

      - name: Deploy para Cloud Run — publisher
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: flyspot-publisher
          image: ${{ env.IMAGE_PUBLISHER }}:latest
          region: southamerica-east1
          project_id: lista-ai-f2916
          # min-instances=1 é obrigatório: o consumidor do outbox
          # (onSnapshot + poll) só existe enquanto o processo está de pé.
          flags: --allow-unauthenticated --min-instances=1
          env_vars: |
            NODE_ENV=production
            FIREBASE_PROJECT_ID=lista-ai-f2916
            API_PUBLIC_URL=${{ steps.deploy-api.outputs.url }}
            EMAIL_ACTION_SECRET=${{ secrets.EMAIL_ACTION_SECRET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}

      # ── flyspot-web (Fase 2 — frontend Next.js, Cloud Run em vez de
      # Vercel, ver _local-adr-policy-001 amendment) ──────────────────────
      - name: Build da imagem Docker — web
        run: |
          docker build \
            -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }} \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
            --build-arg API_URL=${{ steps.deploy-api.outputs.url }} \
            -t ${{ env.IMAGE_WEB }}:${{ github.sha }} \
            -t ${{ env.IMAGE_WEB }}:latest \
            .

      - name: Push para o Artifact Registry — web
        run: docker push --all-tags ${{ env.IMAGE_WEB }}

      - name: Deploy para Cloud Run — web
        id: deploy-web
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: flyspot-web
          image: ${{ env.IMAGE_WEB }}:latest
          region: southamerica-east1
          project_id: lista-ai-f2916
          flags: --allow-unauthenticated

      # ── Firebase Hosting (flyspot.com.br → rewrite pro flyspot-web, ver
      # _local-adr-policy-003 platform) — Cloud Run domain mapping nativo
      # não funciona em southamerica-east1, por isso o domínio custom é
      # anexado no Hosting, não no Cloud Run. Reusa a mesma credencial
      # GCP_SA_KEY do passo de autenticação acima; requer que essa service
      # account tenha o papel "Firebase Hosting Admin"
      # (roles/firebasehosting.admin) — se o deploy falhar por permissão,
      # é isso que falta conceder no IAM do projeto lista-ai-f2916.
      - name: Deploy do Firebase Hosting
        run: npx --yes firebase-tools deploy --only hosting --project lista-ai-f2916 --non-interactive

      - name: URLs dos serviços
        run: |
          echo "✅ Deploy concluído"
          echo "scraper: ${{ steps.deploy-scraper.outputs.url }}"
          echo "api: ${{ steps.deploy-api.outputs.url }}"
          echo "web: ${{ steps.deploy-web.outputs.url }}"
