name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint (type-check)
        run: npm run lint

      - name: Test types package
        run: npm run test --workspace=@mpa/types

      - name: Test api service
        run: npm run test --workspace=@mpa/api

      - name: Build frontend
        run: npm run build

      - name: Build api service
        run: npm run build --workspace=@mpa/api

      - name: Build generator service
        run: npm run build --workspace=@mpa/generator

      - name: Build publisher service
        run: npm run build --workspace=@mpa/publisher

      - name: Build web (Next.js)
        run: npm run build --workspace=@mpa/web
